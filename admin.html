<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #eef2f3;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        .btn-exit {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn-exit:hover { background-color: #a71d2a; }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Bienvenidos al Panel de Admin!</h1>
        <p>Hola, administrador. Has ingresado correctamente a <b>Fintech Jason</b>.</p>
        <a href="index.html" class="btn-exit">Cerrar sesión</a>
    </div>

</body>
</html>
