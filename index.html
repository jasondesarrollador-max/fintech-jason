<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Fintech Jason</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #eef2f3;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { 
            display: block; 
            margin: 15px auto; 
            padding: 12px; 
            width: 90%; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
        }
        button { 
            padding: 12px 20px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        #error { color: #dc3545; margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ingreso Fintech</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="clave" placeholder="Contraseña">
        <button onclick="validar()">Ingresar</button>
        <p id="error"></p>
    </div>

    <script>
        function validar() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('clave').value;
            
            if (user === "adminblue" && pass === "adminblue") {
                window.location.href = "admin.html";
            } else {
                document.getElementById('error').innerText = "Usuario o clave incorrectos";
            }
        }
    </script>
</body>
</html>
