<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Fintech</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .login-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { display: block; margin: 10px 0; padding: 8px; width: 200px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Ingreso al Sistema</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="clave" placeholder="Contraseña">
        <button onclick="validar()">Ingresar</button>
        <p id="error" style="color:red;"></p>
    </div>

    <script>
        function validar() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('clave').value;
            
            // Usuario y contraseña predefinidos
            if (user === "adminblue" && pass === "adminblue") {
                window.location.href = "admin.html";
            } else {
                document.getElementById('error').innerText = "Usuario o clave incorrectos";
            }
        }
    </script>
</body>
</html>
